[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "graphker"
version = "0.1.0"
description = "Cybersecurity graph data ingestion scripts for Neo4j"
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "GraphKer contributors"}]
dependencies = [
    "xmltodict~=0.12.0",
    "neo4j~=4.3.4",
    "requests~=2.26.0",
    "beautifulsoup4~=4.9.3",
    "circuitbreaker>=1.3.2,<2.0.0",
]

[project.scripts]
graphker = "main:main"

[tool.uv]
package = true
