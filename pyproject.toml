[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "graphker"
version = "0.1.0"
description = "Cybersecurity graph data ingestion scripts for Neo4j"
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "GraphKer contributors"}]
dependencies = [
    "xmltodict~=0.12.0",
    "neo4j~=4.3.4",
    "requests~=2.26.0",
    "beautifulsoup4~=4.9.3",
    "circuitbreaker>=1.3.2,<2.0.0",
    "tqdm>=4.66.0,<5.0.0",
    "loguru>=0.7.2,<0.8.0",
]

[project.scripts]
graphker = "main:main"

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["."]
exclude = ["IMPORT_PATH*", "IMPORT_PATHmitre_*", "CypherScripts*", "tests*"]

[dependency-groups]
dev = [
    "pytest>=8.3.0,<9.0.0",
]
